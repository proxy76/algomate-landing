<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Site-wide: feed readers and aggregators discover the blog feed from any page. -->
    <link rel="alternate" type="application/rss+xml" title="AlgoMate — Blog" href="https://algomate.ro/feed.xml" />

    <!--
      SEO meta tags (title, description, canonical, OG, Twitter) are
      handled entirely by the React 19 <SEO /> component, which hoists
      them into <head> at render time. The prerender script then bakes
      the final HTML into static files. No fallback tags needed here.
    -->

    <!-- Fonts are self-hosted: src/fonts.css, preloaded by vite.config.ts.
         There is deliberately no third-party request anywhere on the site. -->

    <!-- Icons. Order matters: browsers that can draw SVG take the last icon
         they understand, so the .ico is listed first and is only the
         fallback. iOS ignores both and wants the apple-touch-icon. All the
         rasters are rendered from favicon.svg by scripts/make-icons.mjs. -->
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
